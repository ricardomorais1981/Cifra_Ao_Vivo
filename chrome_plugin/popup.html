<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --muted:#6b6b70; --line:#e2e2e6; --accent:#1f6feb; --rec:#d32f2f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1e1e20; --fg:#f2f2f4; --muted:#a0a0a8; --line:#3a3a3e; } }
  body { width: 300px; box-sizing: border-box; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; color: var(--muted); font-size: 12px; margin: 8px 0 3px; }
  input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; }
  button { width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 6px; font: 600 13px system-ui; cursor: pointer; color: #fff; background: var(--accent); }
  button.rec { background: var(--rec); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin-top: 10px; padding: 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 12px; }
  .status.err { border-color: var(--rec); color: var(--rec); }
  .timer { font: 600 22px ui-monospace, monospace; text-align: center; margin: 6px 0 0; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 8px; line-height: 1.4; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>🎸 Cifra ao Vivo</h1>

  <div id="idleView">
    <label for="title">Música</label>
    <input id="title" placeholder="Título">
    <label for="artist">Artista</label>
    <input id="artist" placeholder="Artista">
    <button id="btnStart">● Gravar esta aba</button>
    <p class="hint">Dê play na música <b>desde o início</b> e grave até o fim. O som continua tocando normalmente.</p>
  </div>

  <div id="recView" class="hidden">
    <div class="timer" id="timer">0:00</div>
    <p class="hint" id="recInfo"></p>
    <button id="btnStop" class="rec">■ Parar e gerar cifra</button>
    <button id="btnCancel" class="ghost">Cancelar</button>
  </div>

  <div id="status" class="status hidden"></div>
  <script src="popup.js"></script>
</body>
</html>
